# Build + test on Apple Silicon macOS runners. The DMG is built locally (it
# needs a Homebrew siril + dylibbundler closure) — see docs/RELEASING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: /tmp/nebula-ci
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Build
        run: bash scripts/swift-xcode.sh build --scratch-path /tmp/nebula-ci

      - name: Test
        run: bash scripts/swift-xcode.sh test --scratch-path /tmp/nebula-ci
